services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxclients", "1000"]
    ports: ["127.0.0.1:6379:6379"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: precedent
      POSTGRES_PASSWORD: precedent
      POSTGRES_DB: precedent
    command: ["postgres", "-c", "max_connections=30", "-c", "superuser_reserved_connections=3"]
    volumes: ["./sandbox/postgres:/docker-entrypoint-initdb.d:ro"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precedent -d precedent"]
      interval: 3s
      timeout: 3s
      retries: 20
  checkout:
    build: ./sandbox/checkout
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://app:app@postgres:5432/precedent
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
